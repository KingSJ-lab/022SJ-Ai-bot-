<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ AI Bot v5</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b141a;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#202c33;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:80%;
padding:10px 15px;
border-radius:12px;
word-wrap:break-word;
line-height:1.4;
}

.user{
align-self:flex-end;
background:#005c4b;
color:white;
}

.bot{
align-self:flex-start;
background:#202c33;
color:white;
}

.input-area{
display:flex;
padding:10px;
background:#202c33;
gap:10px;
}

#userInput{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:25px;
background:#2a3942;
color:white;
font-size:16px;
}

button{
padding:12px 18px;
border:none;
border-radius:25px;
background:#00a884;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<div class="header">SJ AI Bot 🤖°</div>

<div id="chat"></div>

<div class="input-area">
<input
type="text"
id="userInput"
placeholder="Ask me anything..."
>
<button onclick="handleSend()">Send</button>
</div>

<script>

// ==========================
// GEMINI API KEY
// ==========================
const API_KEY = "AQ.Ab8RN6J9GHjmtRCjuXk7tPAEjYccxrqFVZtsFrIFScj_dnYU6A";
 
// ==========================
// MEMORY
// ==========================
let conversationHistory = [];

// ==========================
// CHAT AREA
// ==========================
const chat = document.getElementById("chat");

// ==========================
// ADD MESSAGE
// ==========================
function addMessage(text,type){

const div = document.createElement("div");

div.className = "message " + type;

div.textContent = text;

chat.appendChild(div);

chat.scrollTop = chat.scrollHeight;

}

// ==========================
// GEMINI RESPONSE
// ==========================
async function getAIResponse(prompt){

conversationHistory.push({
role:"user",
parts:[
{
text:prompt
}
]
});

try{

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:conversationHistory
})
}
);

const data = await response.json();

console.log(data);

if(data.error){
if (data.error?.message?.includes("quota")) {
    return "⚠️ Free Gemini limit reached. Please wait a few seconds and try again.";
}

return "Error: " + data.error.message;
}

const reply =
data.candidates?.[0]?.content?.parts?.[0]?.text
||
"No response received.";

conversationHistory.push({
role:"model",
parts:[
{
text:reply
}
]
});

return reply;

}
catch(error){

console.error(error);

return "Connection error. Check internet.";

}

}

// ==========================
// SEND MESSAGE
// ==========================
async function handleSend(){

const input = document.getElementById("userInput");

const text = input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value = "";

addMessage("Typing...","bot");

const reply = await getAIResponse(text);

chat.removeChild(chat.lastChild);

addMessage(reply,"bot");

}

// ==========================
// ENTER KEY SUPPORT
// ==========================
document
.getElementById("userInput")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){
handleSend();
}

});

// ==========================
// STARTUP MESSAGE
// ==========================
addMessage(
"SJ AI Bot v5 is online 🚀 AN INVENTION OF KING SJ SUPPORTED BY GEMINI V2",
"bot"
);

</script>

</body>
  </html>
